<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: '#6366f1',
          secondary: '#06b6d4',
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'sans-serif'],
        }
      }
    }
  }
</script>
<!-- Google Font: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<header class="w-full sticky top-0 z-50">
  <div class="backdrop-blur-md bg-white/75 border-b border-slate-200/50 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- BRAND LOGO & NAME (LEFT) -->
        <a href="/" class="flex-shrink-0 flex items-center gap-3 group no-underline">
          <div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-secondary shadow-md shadow-indigo-200/50 overflow-hidden">
            <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            <!-- Neural Network / AI Styled SVG Icon -->
            <svg class="w-6 h-6 text-white transform group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
          </div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-accent via-purple-600 to-secondary bg-clip-text text-transparent select-none">
            Neural News Engine
          </span>
        </a>

        <!-- DESKTOP NAV BUTTONS (RIGHT) -->
        <nav class="hidden md:flex items-center gap-6">
          <a href="/" class="relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-accent transition-colors duration-200 group no-underline">
            Home
            <span class="absolute bottom-0 left-0 w-full h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
          </a>
          <a href="/about" class="relative px-3 py-2 text-sm font-semibold text-slate-700 hover:text-accent transition-colors duration-200 group no-underline">
            About Us
            <span class="absolute bottom-0 left-0 w-full h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
          </a>
          
          <div class="h-6 w-px bg-slate-200"></div>
          <!-- System Status Badge -->
          <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-200/60 rounded-full px-3 py-1 text-xs font-semibold text-emerald-700">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            System Active
          </div>
        </nav>

        <!-- MOBILE MENU TOGGLE BUTTON -->
        <div class="md:hidden">
          <button id="mobile-menu-btn" class="p-2 rounded-xl text-slate-500 hover:text-slate-700 hover:bg-slate-100 focus:outline-none transition-colors duration-200">
            <svg class="h-6 w-6" id="menu-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg class="h-6 w-6 hidden" id="close-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- MOBILE MENU DROPDOWN -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-100 bg-white/95 backdrop-blur-md transition-all duration-300 ease-in-out">
      <div class="px-4 pt-2 pb-4 space-y-2">
        <a href="/" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-slate-700 hover:text-accent hover:bg-slate-50 transition-all duration-200 no-underline">
          Home
        </a>
        <a href="/about" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-slate-700 hover:text-accent hover:bg-slate-50 transition-all duration-200 no-underline">
          About Us
        </a>
        <div class="pt-2 border-t border-slate-100">
          <div class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-emerald-700">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            System Active
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  document.getElementById('mobile-menu-btn').addEventListener('click', function() {
    const menu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    const closeIcon = document.getElementById('close-icon');
    
    if (menu.classList.contains('hidden')) {
      menu.classList.remove('hidden');
      menuIcon.classList.add('hidden');
      closeIcon.classList.remove('hidden');
    } else {
      menu.classList.add('hidden');
      menuIcon.classList.remove('hidden');
      closeIcon.classList.add('hidden');
    }
  });
</script>
